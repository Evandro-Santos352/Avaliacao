<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GoodPay | Minha conta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./bootstrap/styles_complements.css">
</head>

<body onload="loadUserStorage()">
    <header>
        <section name="navbar-site">
            <nav class="navbar navbar-dark fixed-top">
                <div class="container">
                    <a class="navbar-brand" href="#">
                        <img src="./assets/goodpay-logo.svg" alt="Logo GoodPay" width="45px" height="45px">
                    </a>
                    <div class="img-fluid">
                        <img src="./assets/goodpay-wordmark.svg" alt="GoodPay" width="25%">
                    </div>
                    <div class="icon"><h5><i class="bi bi-instagram"></i></h5></div>
                    <div class="icon"><h5><i class="bi bi-youtube"></i></h5></div>
                    <div class="icon"><h5><i class="bi bi-facebook"></i></h5></div>
                    <div class="icon"><h5><i class="bi bi-twitter-x"></i></h5></div>
                    <div class="icon"><h5><i class="bi bi-tiktok"></i></h5></div>
                    <div class="icon"><h5><i class="bi bi-line"></i></h5></div>
                    <div class="btn-group">
                        <button type="button" class="btn btn-primary">
                            <i class="bi bi-wallet2 text-white"></i> Minha carteira
                        </button>
                        <button type="button" class="btn btn-primary dropdown-toggle dropdown-toggle-split"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            <span class="visually-hidden">Minha carteira</span>
                        </button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Minha conta</a></li>
                            <li><a class="dropdown-item" href="#">Histórico de movimentações</a></li>
                            <li><a class="dropdown-item" href="#">Saldo e extratos</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#">Sair da conta</a></li>
                        </ul>
                    </div>
                    <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas"
                        data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar"
                        aria-label="Abrir menu">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar"
                        aria-labelledby="offcanvasNavbarLabel">
                        <div class="offcanvas-header">
                            <img src="./assets/goodpay-wordmark.svg" alt="GoodPay" width="100%">
                            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"
                                aria-label="Fechar"></button>
                        </div>
                        <div class="offcanvas-body">
                            <hr>
                            <span id="load-extrato">Carregando suas movimentações...</span>
                        </div>
                    </div>
                </div>
            </nav>
        </section>
    </header>
    <main>
        <section name="area-assinante" style="margin-top: 5%;">
            <div class="container">
                <div class="card mb-3" style="max-width: 100%">
                    <div class="row g-0">
                        <div class="col-md-4">
                            <span id="load-img"></span>
                        </div>
                        <div class="col-md-8">
                            <div class="card-body">
                                <h5 class="card-title" id="load-nome">Bem-vindo ao GoodPay</h5>
                                <p class="card-text" id="load-email">demo@goodpay.com.br</p>
                                <p class="card-text"><small class="text-body-secondary" id="load-data">Última atualização</small>
                                </p>
                                <span id="login-extrato">Suas informações financeiras em um só lugar.</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <script src="./engine/index.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
            integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
            crossorigin="anonymous"></script>
    </footer>
</body>
</html>
